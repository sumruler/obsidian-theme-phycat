name: Validate and release Phycat

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phycat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Check release version, CSS, settings and presets
        run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: npm test
      - name: Build and verify release archives
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: phycat-release
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: phycat-release
          path: dist/
      - name: Publish verified assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Phycat ${{ github.ref_name }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/manifest.json
            dist/theme.css
            dist/obsidian-phycat-theme-*.zip
            dist/phycat-presets-*.zip
            dist/SHA256SUMS
